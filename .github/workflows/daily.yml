name: Daily update

# New filings, fresh prices and news, rebuilt site data and private picks,
# deployed to Vercel. Runs before the US market opens.
on:
  schedule:
    - cron: "30 11 * * *"   # 11:30 UTC = 7:30 am New York (6:30 in winter)
  workflow_dispatch: {}

concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write   # only to push the encrypted agent-desk state to its own branch

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # the very first run downloads every filing since 2014
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # TradingAgents is pinned to a reviewed commit so an upstream change can't alter the job unannounced.
        run: |
          pip install -e . pandas numpy statsmodels scipy yfinance matplotlib requests beautifulsoup4 lxml pdfplumber pyarrow cryptography
          pip install "git+https://github.com/TauricResearch/TradingAgents.git@1394a3f72aa4393e1a98f51b382434c4b4c2d972"

      - name: Restore filing and price caches
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/interim
          key: pipeline-data-v2-${{ github.run_id }}
          restore-keys: pipeline-data-v2-

      - name: Seed caches from the data-seed release (first run only)
        if: hashFiles('data/interim/prices.parquet') == ''
        run: |
          echo "No cached data; downloading the seed archive."
          curl -sL --retry 3 -o seed.tar.gz \
            "https://github.com/${{ github.repository }}/releases/download/data-seed/pipeline-seed.tar.gz"
          tar -xzf seed.tar.gz && rm seed.tar.gz
          du -sh data/raw data/interim

      - name: Restore agent-desk state (encrypted branch)
        env:
          AGENTS_STATE_KEY: ${{ secrets.AGENTS_STATE_KEY }}
        run: |
          mkdir -p data/private
          if [ -z "$AGENTS_STATE_KEY" ]; then echo "AGENTS_STATE_KEY is not set; the agent desk starts fresh"; exit 0; fi
          if git fetch --depth=1 origin agents-state 2>/dev/null; then
            git show FETCH_HEAD:state.enc > data/private/agents_state.enc
            python -m congress.secure_state decrypt data/private/agents_state.enc data/private/agents_state.json
            echo "restored the agent-desk state"
          else
            echo "no saved agent-desk state yet"
          fi

      - name: Update data, picks and the agent desk
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -u -m congress.daily

      - name: Save agent-desk state (encrypted branch)
        if: always()
        env:
          AGENTS_STATE_KEY: ${{ secrets.AGENTS_STATE_KEY }}
        run: |
          if [ -z "$AGENTS_STATE_KEY" ] || [ ! -f data/private/agents_state.json ]; then echo "nothing to save"; exit 0; fi
          python -m congress.secure_state encrypt data/private/agents_state.json "$RUNNER_TEMP/state.enc"
          blob=$(git hash-object -w "$RUNNER_TEMP/state.enc")
          tree=$(printf '100644 blob %s\tstate.enc\n' "$blob" | git mktree)
          parent=$(git ls-remote origin refs/heads/agents-state | cut -f1)
          args=""
          if [ -n "$parent" ]; then git fetch --depth=1 origin agents-state && args="-p $parent"; fi
          commit=$(git -c user.name=daily-bot -c user.email=daily-bot@users.noreply.github.com commit-tree "$tree" $args -m "agent state $(date -u +%F)")
          git push origin "$commit:refs/heads/agents-state"
          echo "saved the encrypted agent-desk state"

      - name: Save caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/interim
          key: pipeline-data-v2-${{ github.run_id }}

      - name: Deploy to Vercel
        if: env.HAS_VERCEL_TOKEN == 'true'
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Check the picks are still password-protected
        if: env.HAS_VERCEL_TOKEN == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          sleep 20
          bad=0
          for path in /picks/recs.json /picks/agents.json /agents; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://congress-trades-roan.vercel.app$path?check=$GITHUB_RUN_ID")
            echo "unauthenticated $path -> $code"
            if [ "$code" != "401" ]; then bad=1; fi
          done
          if [ "$bad" != "0" ]; then
            echo "::error::Private data is reachable without the password. Redeploying without it."
            rm -rf web/public/picks
            (cd web && npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
            exit 1
          fi

      - name: Remind that deploys are off
        if: env.HAS_VERCEL_TOKEN != 'true'
        run: echo "::warning::VERCEL_TOKEN secret is not set, so the data was updated and cached but not deployed."
